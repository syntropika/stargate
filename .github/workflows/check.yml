name: check
on: [push, pull_request]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: install native build dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libclang-dev
      - run: python -m venv .venv
      - run: PATH="$PWD/.venv/bin:$PATH" scripts/check.sh
      - name: verify embedded frontend assets
        run: git diff --exit-code -- crates/ui/assets
