name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages after building and testing
        type: boolean
        default: false
      source_ref:
        description: Existing version tag to build (defaults to the workflow ref)
        type: string
        default: ''
      registries:
        description: Registries to publish; choose a subset when retrying a partial release
        type: choice
        options: [all, pypi, npm, crates.io, npm-and-crates.io]
        default: all
      bootstrap:
        description: Use configured npm and crates.io token secrets instead of OIDC
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Verify version and release ref
        env:
          PUBLISH: ${{ inputs.publish }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          assert json.loads(pathlib.Path('packages/node/package.json').read_text())['version'] == version
          assert tomllib.loads(pathlib.Path('packages/python/pyproject.toml').read_text())['project']['version'] == version
          if os.environ['PUBLISH'] == 'true':
              assert os.environ['SOURCE_REF'] in ('v' + version, 'refs/tags/v' + version), 'Publish from the matching version tag'
          PY
      - run: python -m venv .venv
      - run: PATH="$PWD/.venv/bin:$PATH" scripts/check.sh
      - name: Validate staged Rust workspace
        run: |
          python scripts/prepare-release.py --only rust --output "$RUNNER_TEMP/release"
          CARGO_TARGET_DIR="$PWD/target" cargo check --workspace --manifest-path "$RUNNER_TEMP/release/rust/Cargo.toml"

  node-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64-gnu
          - os: macos-14
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: python scripts/build-bindings.py --release --node-only
        if: runner.os != 'Windows'
      - run: python scripts/build-bindings.py --release --node-only
        if: runner.os == 'Windows'
        shell: pwsh
      - run: npm install --no-package-lock --no-audit --no-fund && npm test && npm run types
        working-directory: packages/node
      - name: Stage npm packages
        run: python scripts/prepare-release.py --only node --output "$RUNNER_TEMP/release"
      - name: Test installed npm tarballs
        run: python scripts/check-node-package.py --packages "$RUNNER_TEMP/release/node"
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: ${{ runner.temp }}/release/node/
          if-no-files-found: error

  python-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare-python-metadata.py
      - uses: PyO3/maturin-action@v1
        with:
          sccache: 'true'
          maturin-version: 'v1.12.6'
          target: ${{ matrix.target }}
          manylinux: '2_28'
          working-directory: packages/python
          args: --release --out dist
      - run: python -m pip install dist/*.whl fastapi pytest httpx cryptography PyJWT
        working-directory: packages/python
      - run: python -m pytest packages/python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.target }}
          path: packages/python/dist/*.whl
          if-no-files-found: error

  pypi-publish:
    if: inputs.publish && (inputs.registries == 'all' || inputs.registries == 'pypi')
    needs: [validate, node-build, python-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm-publish:
    if: inputs.publish && (inputs.registries == 'all' || inputs.registries == 'npm' || inputs.registries == 'npm-and-crates.io')
    needs: [validate, node-build, python-build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: node-linux-x64-gnu
          path: node
      - uses: actions/download-artifact@v4
        with:
          name: node-darwin-arm64
          path: node
      - uses: actions/download-artifact@v4
        with:
          name: node-win32-x64-msvc
          path: node
      - name: Configure first-publication authentication
        if: inputs.bootstrap
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NPM_TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
      - name: Publish native packages, then the public wrapper
        run: |
          npm publish ./node/linux-x64-gnu --access public --provenance
          npm publish ./node/darwin-arm64 --access public --provenance
          npm publish ./node/win32-x64-msvc --access public --provenance
          npm publish ./node/main --access public --provenance

  crates-publish:
    if: inputs.publish && (inputs.registries == 'all' || inputs.registries == 'crates.io' || inputs.registries == 'npm-and-crates.io')
    needs: [validate, node-build, python-build]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: python scripts/prepare-release.py --only rust --output "$RUNNER_TEMP/release"
      - uses: rust-lang/crates-io-auth-action@v1
        if: ${{ !inputs.bootstrap }}
        id: auth
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.bootstrap && secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cd "$RUNNER_TEMP/release/rust"
          for package in syntropika-stargate-ui syntropika-stargate-storage syntropika-stargate-core syntropika-stargate-http syntropika-stargate; do
            cargo publish --package "$package" --allow-dirty
          done
