[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
url = { version = "2.5.8", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"
zeroize = { version = "1.9", features = ["derive"] }
http-types = { package = "http", version = "1" }
storage = { path = "crates/storage" }
runtime-core = { package = "core", path = "crates/core" }
runtime-http = { package = "http", path = "crates/http" }
ui = { path = "crates/ui" }
rust = { path = "crates/rust" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
